name: Development app image

on:
  push:
    tags: ["v*-dev.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.29"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --locked ruff check src tests custom_components
      - run: uv run --locked ruff format --check src tests custom_components
      - run: uv run --locked pytest -q
      - run: uv run --locked python -m build --no-isolation

  containers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            target: standalone
          - platform: linux/arm64
            target: standalone
          - platform: linux/arm/v7
            target: standalone
          - platform: linux/amd64
            target: addon
          - platform: linux/arm64
            target: addon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build installed image
        env:
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
        run: |
          docker buildx build --load --platform "$PLATFORM" --target "$TARGET" \
            --build-arg REVISION="$GITHUB_SHA" --tag ha-growatt:test .
      - name: Check installed receiver and transport
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm --platform "$PLATFORM" --user 10001:10001 \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=32m,mode=1777 \
            -v "$PWD/tests:/tests:ro" --entrypoint python \
            ha-growatt:test /tests/container_probe.py
      - name: Check Supervisor options and privilege drop
        if: matrix.target == 'addon'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm --platform "$PLATFORM" --user 0:0 \
            --read-only --cap-drop ALL --cap-add CHOWN --cap-add SETUID \
            --cap-add SETGID --cap-add KILL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=32m,mode=1777 \
            --tmpfs /data:rw,noexec,nosuid,size=32m,mode=1777 \
            -v "$PWD/tests:/tests:ro" --entrypoint python \
            ha-growatt:test /tests/container_probe.py --supervisor

  publish:
    needs: [python, containers]
    if: github.repository == 'loearthorbit/HA-Growatt' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Match the tag to the app version
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -Fx "version: $version" addons/ha-growatt/config.yaml
          printf 'IMAGE_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the checked development app
        run: |
          docker buildx build --push --platform linux/amd64,linux/arm64 \
            --target addon --build-arg VERSION="$IMAGE_VERSION" \
            --build-arg REVISION="$GITHUB_SHA" \
            --tag "ghcr.io/loearthorbit/ha-growatt:$IMAGE_VERSION" .
      - name: Confirm the multi-architecture image
        run: |
          docker buildx imagetools inspect "ghcr.io/loearthorbit/ha-growatt:$IMAGE_VERSION"
